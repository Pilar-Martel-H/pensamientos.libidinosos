<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pensamientos Libidinosos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #ffffff;
            color: #111111;
            font-family: Georgia, "Times New Roman", serif;
        }

        header {
            max-width: 1100px;
            margin: 0 auto;
            padding: 70px 30px 40px;
            border-bottom: 1px solid #111111;
        }

        .site-title {
            font-size: 42px;
            font-weight: normal;
            letter-spacing: -1px;
            margin: 0;
        }

        .site-description {
            margin-top: 12px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 30px;
        }

        .year {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        article {
            padding: 0 0 45px;
            margin-bottom: 45px;
            border-bottom: 1px solid #dddddd;
        }

        article h2 {
            font-size: 30px;
            font-weight: normal;
            margin: 0 0 12px;
        }

        article p {
            max-width: 650px;
            font-size: 17px;
            line-height: 1.7;
            margin: 0 0 18px;
        }

        .date {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        footer {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px;
            border-top: 1px solid #111111;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {

            header {
                padding: 45px 20px 30px;
            }

            .site-title {
                font-size: 32px;
            }

            main {
                padding: 40px 20px;
            }

            article h2 {
                font-size: 25px;
            }

            article p {
                font-size: 16px;
            }

            footer {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <header>

        <h1 class="site-title">
            Pensamientos Libidinosos
        </h1>

        <div class="site-description">
            Textos · documentos · lecturas
        </div>

    </header>


    <main>

        <div class="year">
            2026
        </div>


        <article>

            <h2>
                Primera publicación
            </h2>

            <p>
                Este espacio reunirá textos, documentos y pensamientos.
                Próximamente aparecerán aquí las primeras publicaciones.
            </p>

            <div class="date">
                30 septiembre 2026
            </div>

        </article>


    </main>


    <footer>

        Pensamientos Libidinosos · 2026

    </footer>

</body>
</html>
